<body>

    <div class="weather">

        <h2>Weather App</h2>

        <input
            type="text"
            id="city"
            placeholder="Enter city name"
        >

        <button onclick="getWeather()">
            Check Weather
        </button>

        <div id="result">
            Enter a city to check its weather.
        </div>

        <a href="../index.html" class="back">
            ← Back to Portfolio
        </a>

    </div>

    <script>
        async function getWeather() {

            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            if (city === "") {
                result.textContent = "Please enter a city name!";
                return;
            }

            result.textContent = "Loading...";

            try {

                const geoResponse = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
                );

                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    result.textContent = "City not found!";
                    return;
                }

                const place = geoData.results[0];

                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`
                );

                const data = await response.json();
                const weather = data.current;

                result.innerHTML = `
                    <h3>${place.name}, ${place.country}</h3>
                    <h1>${weather.temperature_2m}°C</h1>
                    <p>Humidity: ${weather.relative_humidity_2m}%</p>
                    <p>Wind Speed: ${weather.wind_speed_10m} km/h</p>
                `;

            } catch (error) {

                result.textContent =
                    "Unable to get weather. Check your internet connection.";

            }
        }

        document.getElementById("city").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                getWeather();
            }
        });
    </script>

</body>
