
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #100b18;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .calculator {
            width: 330px;
            background: #1c1429;
            padding: 22px;
            border-radius: 18px;
            border: 1px solid #9333ea;
            box-shadow: 0 0 25px #6d28d9;
        }

        h2 {
            text-align: center;
            color: #c084fc;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            background: #302440;
            color: white;
            border: none;
            border-radius: 10px;
            text-align: right;
            padding: 12px;
            font-size: 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            background: #302440;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .operator {
            background: #9333ea;
        }

        .clear {
            background: #dc2626;
        }

        .equal {
            background: #7e22ce;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c084fc;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>My Calculator</h2>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="chooseOperator('%')">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <a class="back" href="../../index.html">← Back to Portfolio</a>

</div>

<script>
    const display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let waitingForSecond = false;

    function appendNumber(number) {
        if (display.value === "Error") clearDisplay();

        if (waitingForSecond) {
            display.value = number === "." ? "0." : number;
            waitingForSecond = false;
            return;
        }

        if (number === "." && display.value.includes(".")) return;

        if (display.value === "0" && number !== ".") {
            display.value = number;
        } else {
            display.value += number;
        }
    }

    function chooseOperator(op) {
        if (display.value === "Error") return;

        if (operator !== null && !waitingForSecond) {
            calculate();
        }

        firstNumber = Number(display.value);
        operator = op;
        waitingForSecond = true;
    }

    function calculate() {
        if (operator === null || waitingForSecond) return;

        const secondNumber = Number(display.value);
        let result;

        switch (operator) {
            case "+": result = firstNumber + secondNumber; break;
            case "-": result = firstNumber - secondNumber; break;
            case "*": result = firstNumber * secondNumber; break;
            case "/":
                result = secondNumber === 0 ? NaN : firstNumber / secondNumber;
                break;
            case "%": result = firstNumber % secondNumber; break;
        }

        display.value = Number.isFinite(result)
            ? String(Number(result.toPrecision(10)))
            : "Error";

        firstNumber = null;
        operator = null;
        waitingForSecond = true;
    }

    function clearDisplay() {
        display.value = "0";
        firstNumber = null;
        operator = null;
        waitingForSecond = false;
    }

    function deleteLast() {
        if (display.value === "Error" || waitingForSecond) {
            display.value = "0";
            waitingForSecond = false;
            return;
        }

        display.value = display.value.length > 1
            ? display.value.slice(0, -1)
            : "0";
    }
</script>

</body>
</html>
